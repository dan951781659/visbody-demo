<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>体围测量对比 - 当次 vs 上次</title>
  <style>
    :root {
      /* 浅色科技蓝 · 统一令牌（两页一致） */
      --bg-page: #f0f4f9;
      --bg: #ffffff;
      --panel: #ffffff;
      --bg-surface: #f7f9fc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #1e293b;
      --subtext: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: rgba(37, 99, 235, 0.08);
      --accent-cyan: #0ea5e9;
      --accent-slate: #64748b;
      --ai-tint: #f5f3ff;
      --ai-border: #ddd6fe;
      --up: #dc2626;
      --down: #16a34a;
      --current-scale: 1;
      --current-waist: 1;
      --history-scale: 1;
      --history-waist: 1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg-page);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      overflow-x: hidden;
    }

    .page {
      width: min(1780px, 100%);
      margin: 0 auto;
      padding: 16px 16px 24px;
    }

    .top-title {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 12px;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .topbar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .left-info, .right-tools {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #606a7b;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .tab {
      border: 1px solid var(--border);
      border-radius: 3px;
      background: #fff;
      color: #4e5a6d;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
    }

    .tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .mode-switch {
      margin: 0 0 8px;
      display: inline-flex;
      gap: 2px;
      padding: 2px;
      background: #f1f5fb;
      border: 1px solid #dfe7f4;
      border-radius: 8px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: #65758d;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .mode-btn.is-active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    /* 窄屏保持「左数据 | 中模型 | 右数据」三栏不变，整体横向滚动查看 */
    .layout-scroll {
      width: 100%;
      overflow-x: auto;
      overflow-y: visible;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      margin-bottom: 4px;
    }

    .layout-scroll::-webkit-scrollbar {
      height: 8px;
    }

    .layout-scroll::-webkit-scrollbar-thumb {
      background: #c9d4e8;
      border-radius: 4px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(500px, 1.45fr) 320px minmax(360px, 1.1fr);
      gap: 12px;
      align-items: stretch;
      min-width: 1260px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
    }

    .current-card {
      min-width: 0;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: #667386;
      background: #fbfcff;
    }

    .card-head .title {
      font-size: 14px;
      color: #384457;
      font-weight: 600;
    }

    .table-wrap {
      padding: 6px 8px 10px;
      overflow: auto;
      flex: 0 1 auto;
    }

    .current-card .table-wrap {
      width: 100%;
      overflow-x: hidden;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 320px;
    }

    .current-card table {
      display: block;
      width: 100%;
      min-width: 0;
      border-spacing: 0;
      table-layout: auto;
    }

    .current-card thead,
    .current-card tbody {
      display: block;
      width: 100%;
    }

    .current-card thead tr,
    .current-card tbody tr.metric-row {
      display: grid;
      grid-template-columns: minmax(0, 44fr) minmax(0, 56fr);
      column-gap: 8px;
      width: 100%;
      align-items: stretch;
    }

    .current-card thead tr {
      margin-bottom: 6px;
    }

    th {
      color: #667386;
      font-size: 11px;
      font-weight: 500;
      text-align: left;
      padding: 0 8px;
    }

    td {
      background: #fff;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 8px 8px;
      font-size: 13px;
      color: #3b4658;
      vertical-align: middle;
    }

    td:first-child {
      border-left: 1px solid var(--border);
      border-radius: 6px 0 0 6px;
      width: 38%;
      color: #556278;
    }

    td:last-child {
      border-right: 1px solid var(--border);
      border-radius: 0 6px 6px 0;
      width: 62%;
      text-align: right;
    }

    .current-card th:first-child,
    .current-card td:first-child {
      width: auto;
    }

    .current-card th:last-child,
    .current-card td:last-child {
      width: auto;
    }

    .current-card td {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 0;
    }

    .current-card td:first-child,
    .current-card td:last-child {
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-radius: 8px;
    }

    .current-card th {
      padding: 0 4px;
    }

    /* 对比模式：体围项目使用统一的行距与内容留白 */
    body:not(.report-mode) .current-card tbody {
      display: grid;
      row-gap: 8px;
    }

    body:not(.report-mode) .current-card td,
    body:not(.report-mode) #historyCard td {
      padding: 10px 12px;
    }

    body:not(.report-mode) #historyCard table {
      border-spacing: 0 8px;
    }

    body:not(.report-mode) #historyCard thead th {
      padding-bottom: 0;
    }

    body:not(.report-mode) .row-label,
    body:not(.report-mode) .cell-with-ai,
    body:not(.report-mode) .cell-with-ai .value-block {
      min-width: 0;
    }

    body:not(.report-mode) .row-label,
    body:not(.report-mode) .cell-with-ai {
      min-height: 24px;
      align-items: center;
    }

    td.cell-delta {
      text-align: right;
      white-space: nowrap;
    }

    .delta-pill {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      vertical-align: middle;
    }

    .delta-pill.up {
      color: var(--up);
      background: #fff1f0;
      border: 1px solid #f5cfcb;
    }

    .delta-pill.down {
      color: var(--down);
      background: #eefaf3;
      border: 1px solid #c6ead8;
    }

    .delta-pill.flat {
      color: #95a1b3;
      background: #f4f6f9;
      border: 1px solid #e3e8ef;
    }

    /* —— 体围行：分层交互（hover / 选中）—— */
    tr.metric-row {
      cursor: pointer;
      transition: background-color 200ms ease-out, box-shadow 200ms ease-out;
    }

    tr.metric-row td {
      transition: background-color 200ms ease-out, border-color 200ms ease-out;
      overflow: visible;
    }

    .current-card tr.metric-row {
      width: 100%;
    }

    tr.metric-row.is-hover td {
      background: #f5f9ff;
      border-color: #6aa6ff;
      box-shadow: inset 0 0 0 1px rgba(84, 126, 255, 0.25);
    }

    tr.metric-row.is-selected td {
      background: linear-gradient(90deg, #f2f7ff 0%, #faf5ff 100%);
      border-color: #5e8fff;
      box-shadow: inset 0 0 0 1px rgba(76, 106, 255, 0.35);
    }

    tr.metric-row.is-selected.is-hover td {
      background: linear-gradient(90deg, #e8f2ff 0%, #f0f8ff 100%);
    }

    tr.metric-row-history {
      cursor: pointer;
      transition: background-color 200ms ease-out, box-shadow 200ms ease-out;
    }

    tr.metric-row-history td {
      transition: background-color 200ms ease-out, border-color 200ms ease-out;
    }

    tr.metric-row-history.is-hover td {
      background: #f5f9ff;
    }

    tr.metric-row-history.is-selected td {
      background: linear-gradient(90deg, #eef6ff 0%, #f8fbff 100%);
      border-color: #93c5fd;
      box-shadow: inset 0 0 0 1px rgba(35, 118, 255, 0.25);
    }

    .row-label {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .info-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid #c5d0e0;
      color: #8b95a7;
      font-size: 10px;
      line-height: 12px;
      text-align: center;
      flex-shrink: 0;
    }

    .cell-with-ai {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
    }

    .cell-with-ai .value-block {
      display: inline-flex;
      align-items: baseline;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 4px;
    }

    .ai-btn {
      flex-shrink: 0;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid var(--ai-border);
      background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%);
      color: #fff;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease-out, transform 200ms ease-out, box-shadow 200ms ease-out;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transform: translateY(4px);
    }

    .ai-btn.is-float {
      position: absolute;
      top: -28px;
      left: -2px;
      z-index: 5;
      white-space: nowrap;
    }

    .ai-btn.is-float::after {
      content: "";
      position: absolute;
      left: 14px;
      bottom: -7px;
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 7px solid #4f46e5;
    }

    .trend-btn {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 5px;
      border: 1px solid #dbeafe;
      background: #fff;
      color: var(--primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      opacity: 0.55;
      transition: opacity 200ms ease-out, background 200ms ease-out, transform 200ms ease-out;
    }

    .trend-btn:hover,
    .trend-btn.is-active {
      opacity: 1;
      background: #edf5ff;
      transform: translateY(-1px);
    }

    tr.metric-row:hover .ai-btn,
    tr.metric-row.is-selected .ai-btn,
    tr.metric-row:hover .trend-btn,
    tr.metric-row.is-selected .trend-btn {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .ai-btn:hover {
      filter: brightness(1.06);
      box-shadow: 0 4px 12px rgba(47, 131, 255, 0.45);
    }

    .ai-btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      opacity: 1;
    }

    .trend-panel {
      margin: 0 8px 12px;
      border: 1px solid rgba(37, 99, 235, 0.18);
      border-radius: 10px;
      background: linear-gradient(180deg, #f8fbff 0%, #ffffff 100%);
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.08);
      display: none;
      overflow: hidden;
    }

    .trend-panel.is-open {
      display: block;
    }

    .trend-panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }

    .trend-panel-close {
      border: none;
      background: transparent;
      color: var(--accent-slate);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }

    .trend-chart-wrap {
      padding: 8px 12px 10px;
    }

    .trend-chart {
      width: 100%;
      height: 130px;
      display: block;
    }

    .trend-axis-labels {
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
      color: #99a3b3;
      font-size: 11px;
      padding: 0 2px;
    }

    .metric-explain {
      position: fixed;
      z-index: 1200;
      width: 280px;
      max-width: calc(100vw - 24px);
      background: #fff;
      border: 1px solid #dbe7f7;
      border-radius: 10px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.16);
      padding: 12px 14px 10px;
      display: none;
    }

    .metric-explain.is-open {
      display: block;
    }

    .metric-explain h4 {
      margin: 0 24px 6px 0;
      font-size: 14px;
      color: #2f3b4d;
    }

    .metric-explain p {
      margin: 0;
      color: #5f6d82;
      font-size: 12px;
      line-height: 1.55;
    }

    .metric-explain-close {
      position: absolute;
      top: 8px;
      right: 8px;
      border: none;
      background: transparent;
      color: #90a0b7;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
    }

    .report-mode #historyCard {
      display: none;
    }

    .report-mode .model-col.history {
      display: none;
    }

    .report-mode .dual-models {
      grid-template-columns: 1fr;
    }

    .report-mode .layout {
      grid-template-columns: minmax(760px, 1.9fr) minmax(340px, 1fr);
      min-width: 1120px;
    }

    .report-mode .current-card table,
    .report-mode .current-card thead,
    .report-mode .current-card tbody,
    .report-mode .current-card thead tr,
    .report-mode .current-card tbody tr.metric-row {
      display: table;
      width: 100%;
      table-layout: fixed;
    }

    .report-mode .current-card thead,
    .report-mode .current-card tbody {
      display: table-row-group;
    }

    .report-mode .current-card thead tr {
      margin-bottom: 0;
    }

    .report-mode .current-card td,
    .report-mode .current-card th {
      border-radius: 0 !important;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      padding: 10px 8px;
      text-align: left;
    }

    .report-mode .current-card tbody tr.metric-row td:last-child {
      text-align: center;
    }

    .std-track {
      position: relative;
      height: 4px;
      border-radius: 4px;
      background: #e5e7eb;
      margin-top: 8px;
    }

    .std-marker {
      position: absolute;
      top: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid #fff;
      background: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }

    /* 当次模型上的围度线（示意） */
    .girth-lines {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .girth-line {
      position: absolute;
      left: 12%;
      right: 12%;
      height: 2px;
      padding: 0;
      margin: 0;
      border: none;
      border-radius: 2px;
      background: rgba(148, 163, 184, 0.85);
      cursor: pointer;
      pointer-events: auto;
      transform: translateY(-50%);
      transition:
        opacity 200ms ease-out,
        height 200ms ease-out,
        background 200ms ease-out,
        box-shadow 200ms ease-out;
    }

    .girth-line.dim {
      opacity: 0.3;
    }

    .girth-line.is-hover {
      height: 4px;
      background: var(--primary);
      box-shadow: 0 0 10px rgba(35, 118, 255, 0.65), 0 0 4px rgba(35, 118, 255, 0.4);
    }

    .girth-line.is-selected {
      height: 4px;
      background: #1d4ed8;
      box-shadow: 0 0 12px rgba(29, 78, 216, 0.75), 0 0 6px rgba(29, 78, 216, 0.45);
    }

    .girth-line.pulse-once {
      animation: girth-pulse 200ms ease-out 1;
    }

    @keyframes girth-pulse {
      0% {
        filter: brightness(1);
        box-shadow: 0 0 6px rgba(35, 118, 255, 0.4);
      }
      50% {
        filter: brightness(1.15);
        box-shadow: 0 0 16px rgba(35, 118, 255, 0.9);
      }
      100% {
        filter: brightness(1);
        box-shadow: 0 0 10px rgba(35, 118, 255, 0.65);
      }
    }

    .silhouette-area .human,
    .silhouette-area .ring {
      z-index: 1;
    }

    /* AI 弹层 */
    .ai-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 200ms ease-out, visibility 200ms ease-out;
    }

    .ai-modal.is-open {
      opacity: 1;
      visibility: visible;
    }

    .ai-modal__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
    }

    .ai-modal__panel {
      position: relative;
      width: min(400px, 100%);
      background: #fff;
      border-radius: 12px;
      padding: 20px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      border: 1px solid var(--border);
      z-index: 1;
    }

    .ai-modal__panel h3 {
      margin: 0 0 10px;
      font-size: 17px;
      font-weight: 600;
    }

    .ai-modal__panel p {
      margin: 0 0 16px;
      font-size: 13px;
      color: #4b5563;
      line-height: 1.55;
    }

    .ai-modal__close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border: none;
      background: #f3f4f6;
      border-radius: 8px;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      color: #6b7280;
    }

    .ai-modal__close:hover {
      background: #e5e7eb;
    }

    .ai-modal__action {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .ai-modal__action:hover {
      filter: brightness(1.05);
    }

    .value-current {
      color: var(--primary);
      font-weight: 700;
      font-size: 18px;
    }

    .value-history {
      color: #425068;
      font-weight: 600;
      font-size: 18px;
    }

    .unit {
      font-size: 11px;
      margin-left: 4px;
      color: #6f7b90;
      font-weight: 500;
    }

    .time-switch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #667386;
    }

    .time-switch select {
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: #3b4658;
      font-size: 12px;
      padding: 0 8px;
      min-width: 170px;
      outline: none;
    }

    .model-center {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: auto;
    }

    .dual-models {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .model-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .model-col.current .silhouette-area {
      border-color: #cfe4ff;
      box-shadow: inset 0 0 0 1px rgba(35, 118, 255, 0.06);
    }

    .model-col.history .silhouette-area {
      border-color: #e2e6ee;
      background: linear-gradient(180deg, #f7f8fb 0%, #eceff5 100%);
    }

    .model-time {
      font-size: 12px;
      color: #7b8799;
      text-align: center;
      padding: 5px 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fbfcff;
    }

    .silhouette-area {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: linear-gradient(180deg, #f8fafd 0%, #eef3fb 100%);
      position: relative;
      min-height: 360px;
    }

    .ring {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: 170px;
      height: 24px;
      border-radius: 50%;
      border: 3px solid #d7deec;
      background: rgba(245, 248, 253, 0.8);
    }

    .ring.current {
      width: calc(170px * var(--current-waist));
    }

    .ring.history {
      width: calc(170px * var(--history-waist));
    }

    .human {
      position: absolute;
      left: 50%;
      top: 28px;
      transform: translateX(-50%);
      width: 108px;
      height: 320px;

    function deltaPill(delta, unit) {
      const abs = Math.abs(delta);
      const text = delta > 0 ? `+${format(abs)}` : delta < 0 ? `-${format(abs)}` : "0";
      const cls = delta > 0 ? "up" : delta < 0 ? "down" : "flat";
      return `<span class="delta-pill ${cls}">${text} ${unit}</span>`;
    }

    function clamp(n, min, max) {
      return Math.min(max, Math.max(min, n));
    }

    function getTrendSeries(metricIdx) {
      const history = historyMeasurements
        .map((r) => ({ date: r.time.slice(5, 10).replace("-", "/"), value: r.values[metricIdx] }))
        .reverse();
      history.push({ date: currentTime.slice(5, 10).replace("-", "/"), value: currentMetrics[metricIdx].current });
      return history;
    }

    function renderTrendPanel(metricIdx) {
      document.getElementById('currentCard').appendChild(trendPanel);
      document.querySelectorAll('.inline-trend-row').forEach(row => row.remove());
      const detail = document.createElement('tr');
      detail.className = 'inline-trend-row';
      const cell = document.createElement('td');
      cell.colSpan = currentMode === 'report' ? 5 : 2;
      detail.appendChild(cell);
      document.querySelector(`#currentRows .metric-row[data-metric-idx="${metricIdx}"]`).after(detail);
      cell.appendChild(trendPanel);
      const metricName = currentMetrics[metricIdx].name;
      const series = getTrendSeries(metricIdx);
      const values = series.map((d) => d.value);
      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = Math.max(max - min, 0.5);
      const width = 680;
      const height = 130;
      const padding = { x: 20, y: 14 };
      const innerW = width - padding.x * 2;
      const innerH = height - padding.y * 2;

      const points = series.map((d, i) => {
        const x = padding.x + (innerW * i) / (series.length - 1 || 1);
        const y = padding.y + innerH - ((d.value - min) / span) * innerH;
        return { x, y, ...d };
      });

      const linePath = points.map((p, i) => `${i === 0 ? "M" : "L"}${p.x.toFixed(2)} ${p.y.toFixed(2)}`).join(" ");
      const areaPath = `${linePath} L ${points[points.length - 1].x.toFixed(2)} ${(padding.y + innerH).toFixed(2)} L ${points[0].x.toFixed(2)} ${(padding.y + innerH).toFixed(2)} Z`;

      trendTitle.textContent = `${metricName} 趋势变化`;
      trendAxisLabels.innerHTML = series.map((d) => `<span>${d.date}</span>`).join("");
      trendChart.innerHTML = `
        <defs>
          <linearGradient id="trendFill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#74b8ff" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#74b8ff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <line x1="${padding.x}" y1="${padding.y + innerH}" x2="${width - padding.x}" y2="${padding.y + innerH}" stroke="#e8eef7" stroke-width="1"/>
        <line x1="${padding.x}" y1="${padding.y + innerH * 0.55}" x2="${width - padding.x}" y2="${padding.y + innerH * 0.55}" stroke="#edf2f8" stroke-width="1"/>
        <path d="${areaPath}" fill="url(#trendFill)"></path>
        <path d="${linePath}" fill="none" stroke="#2563eb" stroke-width="2.5"></path>
        ${points.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#fff" stroke="#2563eb" stroke-width="2"/>`).join("")}
        <text x="${points[points.length - 1].x}" y="${points[points.length - 1].y - 8}" text-anchor="middle" fill="#5d6c80" font-size="12">${points[points.length - 1].value.toFixed(1)}</text>
      `;

      trendPanel.classList.add("is-open");
      activeTrendMetricIdx = metricIdx;
      document.querySelectorAll(".trend-btn").forEach((btn) => {
        btn.classList.toggle("is-active", Number(btn.dataset.metricIdx) === metricIdx);
      });
    }

    function applyModelVisuals(selected, metricIdx = null) {
      const focusIdx = metricIdx ?? 0;
      const currentValue = currentMetrics[focusIdx]?.current ?? 0;
      const historyValue = selected.values[focusIdx] ?? 0;
      const delta = currentValue - historyValue;

      const currentScale = clamp(1 + delta * 0.008, 0.92, 1.1);
      const historyScale = clamp(1 - delta * 0.006, 0.9, 1.08);
      const currentWaistRing = clamp(1 + delta * 0.018, 0.84, 1.14);
      const historyWaistRing = clamp(1 - delta * 0.015, 0.82, 1.12);

      root.style.setProperty("--current-scale", String(currentScale));
      root.style.setProperty("--history-scale", String(historyScale));
      root.style.setProperty("--current-waist", String(currentWaistRing));
      root.style.setProperty("--history-waist", String(historyWaistRing));
    }

    function buildGirthLines() {
      const linesHtml = METRIC_LINE_TOP_PCT.map((top, idx) =>
        `<button type="button" class="girth-line" data-metric-idx="${idx}" style="top:${top}%" aria-label="${currentMetrics[idx].name}围度线"></button>`
      ).join("");
      girthLinesEl.innerHTML = linesHtml;
      historyGirthLinesEl.innerHTML = linesHtml;

      function bindLines(container) {
        container.querySelectorAll(".girth-line").forEach((btn) => {
          btn.addEventListener("mouseenter", () => {
            hoverMetricIdx = Number(btn.dataset.metricIdx);
            syncInteractionVisuals();
          });
          btn.addEventListener("mouseleave", () => {
            hoverMetricIdx = null;
            syncInteractionVisuals();
          });
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const i = Number(btn.dataset.metricIdx);
            selectedMetricIdx = i;
            pulseLine(i);
            syncInteractionVisuals();
            applyModelVisuals(historyMeasurements[selectedHistoryIndex], i);
            scrollRowIntoView(i);
          });
        });
      }
      bindLines(girthLinesEl);
      bindLines(historyGirthLinesEl);
    }

    function pulseLine(idx) {
      const lineA = girthLinesEl.querySelector(`.girth-line[data-metric-idx="${idx}"]`);
      const lineB = historyGirthLinesEl.querySelector(`.girth-line[data-metric-idx="${idx}"]`);
      [lineA, lineB].forEach((line) => {
        if (!line) return;
        line.classList.remove("pulse-once");
        void line.offsetWidth;
        line.classList.add("pulse-once");
        setTimeout(() => line.classList.remove("pulse-once"), 220);
      });
    }

    function syncInteractionVisuals() {
      const lines = [...girthLinesEl.querySelectorAll(".girth-line"), ...historyGirthLinesEl.querySelectorAll(".girth-line")];
      const activeHover = hoverMetricIdx;
      const activeSel = selectedMetricIdx;

      lines.forEach((line) => {
        const i = Number(line.dataset.metricIdx);
        line.classList.remove("dim", "is-hover", "is-selected");
        if (activeHover !== null) {
          if (i !== activeHover) line.classList.add("dim");
          else line.classList.add("is-hover");
        } else if (activeSel !== null) {
          if (i !== activeSel) line.classList.add("dim");
          else line.classList.add("is-selected");
        }
      });

      document.querySelectorAll("tr.metric-row").forEach((row) => {
        const i = Number(row.dataset.metricIdx);
        row.classList.toggle("is-hover", activeHover !== null && i === activeHover);
        row.classList.toggle("is-selected", activeSel !== null && i === activeSel);
      });
      document.querySelectorAll("tr.metric-row-history").forEach((row) => {
        const i = Number(row.dataset.metricIdx);
        row.classList.toggle("is-hover", activeHover !== null && i === activeHover);
        row.classList.toggle("is-selected", activeSel !== null && i === activeSel);
      });
    }

    function scrollRowIntoView(idx) {
      const cur = document.querySelector(`tr.metric-row[data-metric-idx="${idx}"]`);
      const hist = document.querySelector(`tr.metric-row-history[data-metric-idx="${idx}"]`);
      cur?.scrollIntoView({ behavior: "smooth", block: "nearest" });
      hist?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function openAiModal(metricIdx) {
      const item = currentMetrics[metricIdx];
      const sel = historyMeasurements[selectedHistoryIndex];
      const prev = sel.values[metricIdx];
      const delta = item.current - prev;
      const deltaStr = delta > 0 ? `+${format(delta)}` : format(delta);
      aiModalContext.innerHTML =
        `当前项目：<strong>${item.name}</strong><br/>` +
        `当次：<strong>${format(item.current)} ${item.unit}</strong>（对比上次 ${format(prev)} ${item.unit}，变化 ${deltaStr} ${item.unit}）<br/>` +
        `可将以上数据作为上下文发送至 AI 进行解读与建议。`;
      aiModal.classList.add("is-open");
      aiModal.setAttribute("aria-hidden", "false");
    }

    function closeAiModal() {
      aiModal.classList.remove("is-open");
      aiModal.setAttribute("aria-hidden", "true");
    }

    function bindTableRowInteractions() {
      function bindRows(selector, isHistory) {
        document.querySelectorAll(selector).forEach((row) => {
          row.tabIndex = 0;
          row.addEventListener('keydown', (e) => {
            if (e.target !== row || !['Enter', ' '].includes(e.key)) return;
            e.preventDefault();
            row.click();
          });
          row.addEventListener("mouseenter", () => {
            hoverMetricIdx = Number(row.dataset.metricIdx);
            syncInteractionVisuals();
          });
          row.addEventListener("mouseleave", () => {
            hoverMetricIdx = null;
            syncInteractionVisuals();
          });
          row.addEventListener("click", (e) => {
            if (e.target.closest(".ai-btn") || e.target.closest(".trend-btn")) return;
            const i = Number(row.dataset.metricIdx);
            selectedMetricIdx = i;
            pulseLine(i);
            syncInteractionVisuals();
            applyModelVisuals(historyMeasurements[selectedHistoryIndex], i);
          });
        });
      }
      bindRows("tr.metric-row", false);
      bindRows("tr.metric-row-history", true);

      document.querySelectorAll(".ai-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const idx = Number(btn.dataset.metricIdx);
          openAiModal(idx);
        });
      });

      document.querySelectorAll(".info-dot").forEach((dot) => {
        dot.addEventListener("click", (e) => {
          e.stopPropagation();
          const idx = Number(dot.dataset.metricIdx);
          const metric = currentMetrics[idx];
          if (metric) openMetricExplain(metric.name, e.clientX, e.clientY);
        });
      });

      document.querySelectorAll(".trend-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const idx = Number(btn.dataset.metricIdx);
          if (activeTrendMetricIdx === idx && trendPanel.classList.contains("is-open")) {
            closeTrendPanel();
          } else {
            renderTrendPanel(idx);
          }
        });
      });
    }

    function renderCurrentTable(selected) {
      if (currentMode === "report") {
        currentRows.innerHTML = currentMetrics.map((item, idx) => {
          const previousValue = selected.values[idx];
          const delta = item.current - previousValue;
          const deltaText = delta > 0 ? `+${format(Math.abs(delta))}` : delta < 0 ? `-${format(Math.abs(delta))}` : "0.0";
          const meta = reportMetaByIdx[idx] || { surpass: "0.0", ratio: "0.0%", low: item.current - 2, mid: item.current + 2, pos: 50, tone: "#2563eb" };
          return `
          <tr class="metric-row" data-metric-idx="${idx}">
            <td>
              <div class="row-label">
                <span>${item.name}</span>
                <button type="button" class="info-dot" data-metric-idx="${idx}" aria-label="${item.name}指标解释">i</button>
                <button type="button" class="ai-btn is-float" data-metric-idx="${idx}">咨询 AI</button>
              </div>
            </td>
            <td><div class="report-value"><span class="value-current">${format(item.current)}</span><span class="unit">${item.unit}</span><span class="report-delta">${delta > 0 ? '↑' : delta < 0 ? '↓' : '—'} ${format(Math.abs(delta))}</span></div></td>
            <td class="report-population">${meta.surpass}</td>
            <td class="report-population">${meta.ratio}<button type="button" class="trend-btn" data-metric-idx="${idx}" aria-label="${item.name}历史趋势">↗</button></td>
            <td>
              <div class="report-standard"><div class="std-track"><span class="std-marker" style="left:${meta.pos}%; background:${meta.tone}; box-shadow:0 0 0 1px ${meta.tone};"></span></div><div class="standard-labels"><span>低</span><span>标准</span><span>高</span></div></div>
            </td>
          </tr>
        `;
        }).join("");
        return;
      }

      currentRows.innerHTML = currentMetrics.map((item, idx) => {
        const previousValue = selected.values[idx];
        const delta = item.current - previousValue;
        return `
        <tr class="metric-row" data-metric-idx="${idx}">
          <td>
            <div class="row-label">
              <button type="button" class="ai-btn is-float" data-metric-idx="${idx}">快速咨询 AI</button>
              <span>${item.name}</span>
              <button type="button" class="info-dot" data-metric-idx="${idx}" aria-label="${item.name}指标解释">i</button>
            </div>
          </td>
          <td class="cell-delta cell-with-ai">
            <span class="value-block">
              <span class="value-current">${format(item.current)}</span><span class="unit">${item.unit}</span>
              ${deltaPill(delta, item.unit)}
            </span>
            <button type="button" class="trend-btn" data-metric-idx="${idx}" title="查看历史趋势">↗</button>
          </td>
        </tr>
      `;
      }).join("");
    }

    function renderHistoryAndSummary(historyIndex) {
      document.getElementById('currentCard').appendChild(trendPanel);
      closeAiModal();
      closeMetricExplain();
      selectedHistoryIndex = historyIndex;
      hoverMetricIdx = null;
      if (selectedMetricIdx === null) selectedMetricIdx = 0;
      const selected = historyMeasurements[historyIndex];
      renderCurrentHead();
      historyHeader.textContent = `上次值（${selected.time}）`;

      historyRows.innerHTML = currentMetrics.map((item, idx) => {
        const value = selected.values[idx];
        return `
          <tr class="metric-row-history" data-metric-idx="${idx}">
            <td>${item.name}</td>
            <td><span class="value-history">${format(value)}</span><span class="unit">${item.unit}</span></td>
          </tr>
        `;
      }).join("");

      historyModelTime.textContent = `上次模型 · ${selected.time}`;

      renderCurrentTable(selected);
      applyModelVisuals(selected, selectedMetricIdx);
      buildGirthLines();
      bindTableRowInteractions();
      syncInteractionVisuals();
      if (activeTrendMetricIdx !== null) {
        renderTrendPanel(activeTrendMetricIdx);
      }
    }

    compareTimeSelect.innerHTML = historyMeasurements
      .map((record, idx) => `<option value="${idx}">${record.time}</option>`)
      .join("");

    compareTimeSelect.addEventListener("change", (event) => {
      renderHistoryAndSummary(Number(event.target.value));
    });

    aiModalBackdrop.addEventListener("click", closeAiModal);
    aiModalClose.addEventListener("click", closeAiModal);
    aiModalConfirm.addEventListener("click", closeAiModal);
    trendCloseBtn.addEventListener("click", closeTrendPanel);
    metricExplainClose.addEventListener("click", closeMetricExplain);
    modeSwitch.querySelectorAll(".mode-btn").forEach((btn) => {
      btn.addEventListener("click", () => setMode(btn.dataset.mode));
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && aiModal.classList.contains("is-open")) closeAiModal();
      if (e.key === "Escape" && metricExplain.classList.contains("is-open")) closeMetricExplain();
    });

    document.addEventListener("click", (e) => {
      if (metricExplain.classList.contains("is-open") && !e.target.closest("#metricExplain") && !e.target.closest(".info-dot")) {
        closeMetricExplain();
      }
    });

    renderHistoryAndSummary(0);
  </script>
</body>
</html>
